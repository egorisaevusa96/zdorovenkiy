# Сервер-посредник «Здаровенький ИИ» на Cloudflare Workers.
# Секреты (НЕ пишите их сюда!) задаются командами:
#   npx wrangler secret put ANTHROPIC_API_KEY   — ключ Claude API
#   npx wrangler secret put FAMILY_CODE         — семейный пароль, который вы впишете в настройках сайта
name = "zdorovenkiy-ai"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# «Ящик для заданий»: меню от ИИ делается в фоне, а телефон спрашивает «готово?».
# Так меню не теряется, если связь с телефоном оборвалась.
[[durable_objects.bindings]]
name = "JOBS"
class_name = "MenuJob"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MenuJob"]

# «Центр» семьи: телефоны, напоминания, счётчик «анти-YouTube»
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Hub"]

# Раз в минуту сервер проверяет, кому пора отправить напоминание
[triggers]
crons = ["* * * * *"]

[vars]
# Модель Claude
MODEL = "claude-opus-5-5"
# Модель для фото еды — дешёвая и быстрая (если будет узнавать плохо: "claude-sonnet-5-5")
PHOTO_MODEL = "claude-haiku-5-5"
# Защита кошелька: сколько запросов к ИИ можно за сутки НА ВСЮ СЕМЬЮ.
# Сверх этого программа скажет «лимит на сегодня исчерпан», завтра счётчик обнулится сам.
LIMIT_MENU = "20"    # меню на неделю от ИИ (самый дорогой запрос)
LIMIT_PHOTO = "150"  # фото еды
LIMIT_COACH = "150"  # вопросы ИИ-тренеру и разборы недели
LIMIT_HOOK = "40"    # «ругань» от ИИ в анти-YouTube (дальше — готовые фразы, бесплатно)
